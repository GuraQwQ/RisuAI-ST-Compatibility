name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 构建运行层
        run: npm run build
      - name: 构建加载器
        run: ./packages/loader/build.ps1 -RustcPath (Get-Command rustc).Source
      - name: 打包并校验
        run: npm run package:release
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/release/*
          if-no-files-found: error
      - name: 发布实验版
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/release/*.zip dist/release/SHA256SUMS.txt --verify-tag --prerelease --title "$env:GITHUB_REF_NAME 实验版" --notes-file docs/release-notes.md
          if ($LASTEXITCODE) { throw 'GitHub Release 发布失败。' }
